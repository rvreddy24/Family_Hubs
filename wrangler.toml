name = "recall"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Keep the free *.workers.dev URL enabled.
workers_dev = true

# Custom domains (zone must be in the deploying Cloudflare account).
# DNS records + TLS certs are provisioned automatically.
routes = [
  { pattern = "familyhubs.in", custom_domain = true },
  { pattern = "www.familyhubs.in", custom_domain = true },
]

# Cloudflare Workers AI — used to embed memories (free daily allocation).
[ai]
binding = "AI"

# Rate limiting (no external storage needed). Keys are supplied at call time:
# RL_API is keyed by space id, RL_SPACES by client IP.
[[unsafe.bindings]]
name = "RL_API"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "RL_SPACES"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 8, period = 60 }

# Non-secret vars. Secrets (SUPABASE_SERVICE_KEY, ADMIN_SECRET) are set with:
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put ADMIN_SECRET
[vars]
SUPABASE_URL = "https://qvwyalktyadfzitdrxqr.supabase.co"
# Embedding model + its output dimension. Must match supabase/schema.sql.
EMBED_MODEL = "@cf/baai/bge-base-en-v1.5"
EMBED_DIM = "768"
# Text model for the /ask (RAG) endpoint.
CHAT_MODEL = "@cf/meta/llama-3.2-3b-instruct"

# Free plan: keep observability off or minimal.
[observability]
enabled = true
